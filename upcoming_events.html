<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upcoming Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Open Sans', Arial, Helvetica, sans-serif;
      background: transparent;
      line-height: 1.6;
      color: #000000;
      font-size: 1rem;
    }
    #event-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 4px 0;
    }

    /* ── SINGLE-DAY CARD ── */
    .card-single {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      padding: 18px 20px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .date-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      background: #f5f0ff;
      border-radius: 8px;
      padding: 8px 6px;
      flex-shrink: 0;
    }
    .date-block .day {
      font-size: 22px;
      font-weight: 700;
      color: #2d2d2d;
      line-height: 1;
    }
    .date-block .month {
      font-size: 11px;
      font-weight: 600;
      color: #7c5cbf;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 2px;
    }

    /* ── SHARED CARD BODY ── */
    .card-body { flex: 1; min-width: 0; }
    .card-title {
      font-family: 'Open Sans', Arial, Helvetica, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 5px;
    }
    .card-description {
      font-family: 'Open Sans', Arial, Helvetica, sans-serif;
      font-size: 0.875rem;
      color: #000000;
      line-height: 1.6;
      margin-bottom: 8px;
      text-align: justify;
    }
    .card-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'Open Sans', Arial, Helvetica, sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      color: #5b21b6;
      text-decoration: none;
      border: 1.5px solid #d0b8f5;
      border-radius: 6px;
      padding: 4px 12px;
      background: #fff;
      transition: background 0.15s, color 0.15s;
    }
    .link-btn:hover { background: #f3e8ff; color: #4c1d95; }
    .link-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

    .status-msg { color: #000000; font-size: 1rem; font-family: 'Open Sans', Arial, sans-serif; }
    .error-msg  { color: #c00; font-size: 1rem; font-family: 'Open Sans', Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="event-container">
    <p class="status-msg">Loading events...</p>
  </div>

  <script>
    const FEED_URL = "https://raw.githubusercontent.com/pmiloc-techops/DEI/main/trial-dei-data.json";

    const EXTERNAL_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

    const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

    function detectDateType(dateStr) {
      const s = dateStr.trim();
      if (!/\d/.test(s)) return "month";
      if (/to|–|—/.test(s)) return "month";
      return "single";
    }

    function parseSingleDate(dateStr) {
      const s = dateStr.trim();
      const monthMatch = s.match(/[A-Za-z]+/);
      const dayMatch   = s.match(/\d+/);
      if (!monthMatch || !dayMatch) return { day: "", month: "" };
      const d = new Date(`${monthMatch[0]} ${dayMatch[0]}, 2000`);
      const month = isNaN(d) ? monthMatch[0].substring(0,3).toUpperCase() : MONTHS[d.getMonth()];
      return { day: dayMatch[0], month };
    }

    function linksHtml(readMore, moreLinks) {
      let html = "";
      if (readMore && readMore !== "undefined" && readMore !== "")
        html += `<a class="link-btn" href="${readMore}" target="_blank" rel="noopener">${EXTERNAL_ICON} Read more</a>`;
      if (moreLinks && moreLinks !== "undefined" && moreLinks !== "")
        html += `<a class="link-btn" href="${moreLinks}" target="_blank" rel="noopener">${EXTERNAL_ICON} More links</a>`;
      return html ? `<div class="card-links">${html}</div>` : "";
    }

    function renderSingleCard(ev) {
      const { day, month } = parseSingleDate(ev.date);
      return `
        <div class="card-single">
          <div class="date-block">
            <span class="day">${day}</span>
            <span class="month">${month}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${ev.title}</div>
            ${ev.description ? `<div class="card-description">${ev.description}</div>` : ""}
            ${linksHtml(ev.readMore, ev.moreLinks)}
          </div>
        </div>`;
    }

    fetch(FEED_URL)
      .then(r => r.json())
      .then(data => {
        const events    = (data.events || []).filter(ev => detectDateType(ev.date) === "single");
        const container = document.getElementById("event-container");

        if (!events.length) {
          container.innerHTML = "<p class='status-msg'>No upcoming events.</p>";
          return;
        }

        container.innerHTML = events.map(ev => renderSingleCard(ev)).join("");
      })
      .catch(() => {
        document.getElementById("event-container").innerHTML =
          "<p class='error-msg'>Unable to load events. Please try again later.</p>";
      });
  </script>
</body>
</html>
