<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden; /* the page itself never scrolls — only the sections inside do */
    }
    body {
      font-family: 'Open Sans', Arial, Helvetica, sans-serif;
      background: transparent;
      line-height: 1.6;
      color: #000000;
      font-size: 1rem;
    }

    /* ── PAGE WRAP: fixed to iframe height, splits into two flexible sections ── */
    #page-wrap {
      height: 750px; /* matches the StarChapter iframe height */
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 4px 2px;
    }

    /* Each section takes an equal share by default (flex: 1).
       If a section is hidden (display:none), the remaining section's
       flex:1 automatically expands to fill all available height. */
    .section {
      display: flex;
      flex-direction: column;
      flex: 1 1 0;
      min-height: 0; /* required so the inner scroll area can actually shrink/scroll inside flex */
    }

    .section-title {
      font-family: 'Open Sans', Arial, Helvetica, sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: #6b6b6b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .section-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-right: 4px; /* room for scrollbar so it doesn't sit on top of card content */
    }

    /* thin, unobtrusive scrollbar */
    .section-list::-webkit-scrollbar { width: 6px; }
    .section-list::-webkit-scrollbar-thumb { background: #d8d0e8; border-radius: 3px; }
    .section-list::-webkit-scrollbar-track { background: transparent; }

    /* ── SINGLE-DAY CARD ── */
    .card-single {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      padding: 18px 20px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      flex-shrink: 0;
    }
    .date-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      background: #f5f0ff;
      border-radius: 8px;
      padding: 8px 6px;
      flex-shrink: 0;
    }
    .date-block .day {
      font-size: 22px;
      font-weight: 700;
      color: #2d2d2d;
      line-height: 1;
    }
    .date-block .month {
      font-size: 11px;
      font-weight: 600;
      color: #7c5cbf;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 2px;
    }

    /* ── MONTH-LONG CARD ── */
    .card-month {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      overflow: hidden;
      flex-shrink: 0;
    }
    .card-month-video {
      width: 240px;
      min-width: 240px;
      background: #ede8f5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-month-video iframe {
      width: 100%;
      height: 100%;
      min-height: 135px;
      border: none;
      display: block;
    }
    .card-month-video .no-video {
      width: 100%;
      min-height: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ede8f5;
    }
    .no-video svg {
      width: 32px;
      height: 32px;
      color: #c4b0e0;
    }
    .card-month-body {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .month-badge {
      display: inline-block;
      font-family: 'Open Sans', Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #5b7e3a;
      background: #eaf4d6;
      border-radius: 4px;
      padding: 2px 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 7px;
      width: fit-content;
    }

    /* ── SHARED CARD BODY TEXT ── */
    .card-title {
      font-family: 'Open Sans', Arial, Helvetica, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 5px;
    }
    .card-description {
      font-family: 'Open Sans', Arial, Helvetica, sans-serif;
      font-size: 0.875rem;
      color: #000000;
      line-height: 1.6;
      margin-bottom: 8px;
      text-align: justify;
    }
    .card-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'Open Sans', Arial, Helvetica, sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      color: #5b21b6;
      text-decoration: none;
      border: 1.5px solid #d0b8f5;
      border-radius: 6px;
      padding: 4px 12px;
      background: #fff;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .link-btn:hover { background: #f3e8ff; color: #4c1d95; }
    .link-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

    .status-msg { color: #000000; font-size: 1rem; font-family: 'Open Sans', Arial, sans-serif; }

    @media (max-width: 600px) {
      .card-month { flex-direction: column; }
      .card-month-video { width: 100%; min-width: 100%; min-height: unset; }
      .card-month-video iframe { width: 100%; height: 140px; min-height: unset; }
      .card-month-video .no-video { height: 60px; min-height: unset; }
      .card-month-body { padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <div id="page-wrap">
    <section class="section" id="section-single">
      <div class="section-title">Upcoming Events</div>
      <div class="section-list" id="single-list">
        <p class="status-msg">Loading...</p>
      </div>
    </section>
    <section class="section" id="section-month">
      <div class="section-title">Monthly Events</div>
      <div class="section-list" id="month-list">
        <p class="status-msg">Loading...</p>
      </div>
    </section>
  </div>

  <script>
    const FEED_URL = "https://raw.githubusercontent.com/pmiloc-techops/DEI/main/dei-data.json";
    const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    const EXTERNAL_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

    function detectDateType(dateStr) {
      const s = dateStr.trim();
      if (!/\d/.test(s)) return "month";
      if (/to|–|—/.test(s)) return "month";
      return "single";
    }

    function parseSingleDate(dateStr) {
      const s = dateStr.trim();
      const monthMatch = s.match(/[A-Za-z]+/);
      const dayMatch   = s.match(/\d+/);
      if (!monthMatch || !dayMatch) return { day: "", month: "" };
      const d = new Date(`${monthMatch[0]} ${dayMatch[0]}, 2000`);
      const month = isNaN(d) ? monthMatch[0].substring(0,3).toUpperCase() : MONTHS[d.getMonth()];
      return { day: dayMatch[0], month };
    }

    function parseMonthBadge(dateStr) {
      if (/to|–|—/.test(dateStr)) return dateStr.toUpperCase();
      const s = dateStr.trim().replace(",", "");
      const parts = s.split(/\s+/);
      const d = new Date(`${parts[0]} 1, 2000`);
      const month = isNaN(d) ? parts[0].toUpperCase() : MONTHS[d.getMonth()];
      return parts[1] ? `${month} ${parts[1]}` : month;
    }

    function toEmbedUrl(url) {
      if (!url) return null;
      try {
        const u = new URL(url.trim());
        let videoId = u.searchParams.get("v");
        if (!videoId) videoId = u.pathname.split("/").filter(Boolean).pop();
        return videoId ? `https://www.youtube.com/embed/${videoId}` : null;
      } catch { return null; }
    }

    function linksHtml(readMore, moreLinks) {
      let html = "";
      if (readMore && readMore !== "undefined" && readMore !== "")
        html += `<a class="link-btn" href="${readMore}" target="_blank" rel="noopener">${EXTERNAL_ICON} Read more</a>`;
      if (moreLinks && moreLinks !== "undefined" && moreLinks !== "")
        html += `<a class="link-btn" href="${moreLinks}" target="_blank" rel="noopener">${EXTERNAL_ICON} More links</a>`;
      return html ? `<div class="card-links">${html}</div>` : "";
    }

    function renderSingleCard(ev) {
      const { day, month } = parseSingleDate(ev.date);
      return `
        <div class="card-single">
          <div class="date-block">
            <span class="day">${day}</span>
            <span class="month">${month}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${ev.title}</div>
            ${ev.description ? `<div class="card-description">${ev.description}</div>` : ""}
            ${linksHtml(ev.readMore, ev.moreLinks)}
          </div>
        </div>`;
    }

    function renderMonthCard(ev) {
      const badge    = parseMonthBadge(ev.date);
      const embedUrl = toEmbedUrl(ev.videoLink);
      const videoHtml = embedUrl
        ? `<iframe src="${embedUrl}" title="${ev.title}" frameborder="0" allowfullscreen></iframe>`
        : `<div class="no-video"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`;

      return `
        <div class="card-month">
          <div class="card-month-video">${videoHtml}</div>
          <div class="card-month-body">
            <span class="month-badge">${badge}</span>
            <div class="card-title">${ev.title}</div>
            ${ev.description ? `<div class="card-description">${ev.description}</div>` : ""}
            ${linksHtml(ev.readMore, ev.moreLinks)}
          </div>
        </div>`;
    }

    fetch(FEED_URL + "?t=" + Date.now(), { cache: "no-store" })
      .then(r => r.json())
      .then(data => {
        const allEvents  = data.events || [];
        const singleList = document.getElementById("single-list");
        const monthList  = document.getElementById("month-list");
        const singleSection = document.getElementById("section-single");
        const monthSection  = document.getElementById("section-month");

        const singleEvents = allEvents.filter(ev => detectDateType(ev.date) === "single");
        const monthEvents  = allEvents.filter(ev => detectDateType(ev.date) === "month");

        // Upcoming (single-day) section
        if (singleEvents.length) {
          singleSection.style.display = "flex";
          singleList.innerHTML = singleEvents.map(renderSingleCard).join("");
        } else {
          singleSection.style.display = "none";
        }

        // Monthly section
        if (monthEvents.length) {
          monthSection.style.display = "flex";
          monthList.innerHTML = monthEvents.map(renderMonthCard).join("");
        } else {
          monthSection.style.display = "none";
        }

        // If neither has events, collapse the whole page-wrap
        if (!singleEvents.length && !monthEvents.length) {
          document.getElementById("page-wrap").style.display = "none";
        }
      })
      .catch(() => {
        document.getElementById("page-wrap").style.display = "none";
      });
  </script>
</body>
</html>
