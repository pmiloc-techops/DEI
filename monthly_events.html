<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Events</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
      line-height: 1.6;
      color: #222;
    }
    #event-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 4px 0;
    }

    /* ── MONTH-LONG CARD ── */
      .card-month {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    
    .card-month-video {
      width: 400px;
      min-width: 400px;
      background: #ede8f5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .card-month-video iframe {
      width: 100%;
      height: 100%;
      min-height: 160px;
      border: none;
      display: block;
    }
    
    .card-month-video .no-video {
      width: 100%;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ede8f5;
    }
    .no-video svg {
      width: 36px;
      height: 36px;
      color: #c4b0e0;
    }
    .card-month-body {
      flex: 1;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .month-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: #5b7e3a;
      background: #eaf4d6;
      border-radius: 4px;
      padding: 2px 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 7px;
      width: fit-content;
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 7px;
    }
    .card-description {
      font-size: 13px;
      color: #444;
      line-height: 1.55;
      margin-bottom: 10px;
    }
    .card-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 600;
      color: #5b21b6;
      text-decoration: none;
      border: 1.5px solid #d0b8f5;
      border-radius: 6px;
      padding: 4px 12px;
      background: #fff;
      transition: background 0.15s, color 0.15s;
    }
    .link-btn:hover { background: #f3e8ff; color: #4c1d95; }
    .link-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

    .status-msg { color: #555; font-size: 14px; }
    .error-msg  { color: #c00; font-size: 14px; }

    @media (max-width: 600px) {
      .card-month {
        flex-direction: column;
      }
      .card-month-video {
        width: 100%;
        min-width: 100%;
        min-height: unset;
      }
      .card-month-video iframe {
        width: 100%;
        height: 180px;
        min-height: unset;
      }
      .card-month-video .no-video {
        height: 60px;
        min-height: unset;
      }
      .card-month-body {
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>
  <div id="event-container">
    <p class="status-msg">Loading...</p>
  </div>

  <script>
    const FEED_URL = "https://raw.githubusercontent.com/pmiloc-techops/DEI/main/trial-dei-data.json";

    const EXTERNAL_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

    const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

    function detectDateType(dateStr) {
      const s = dateStr.trim();
      // If it contains a day number anywhere, it's a specific date or range
      if (/\d/.test(s)) return "single";
      // No numbers at all = month-only
      return "month";
    }
    function parseMonthBadge(dateStr) {
      const s = dateStr.trim().replace(",", "");
      const parts = s.split(/\s+/);
      const d = new Date(`${parts[0]} 1, 2000`);
      const month = isNaN(d) ? parts[0].toUpperCase() : MONTHS[d.getMonth()];
      return parts[1] ? `${month} ${parts[1]}` : month;
    }

    function toEmbedUrl(url) {
      if (!url) return null;
      try {
        const u = new URL(url.trim());
        let videoId = u.searchParams.get("v");
        if (!videoId) videoId = u.pathname.split("/").filter(Boolean).pop();
        return videoId ? `https://www.youtube.com/embed/${videoId}` : null;
      } catch { return null; }
    }

    function linksHtml(readMore, moreLinks) {
      let html = "";
      if (readMore && readMore !== "undefined" && readMore !== "")
        html += `<a class="link-btn" href="${readMore}" target="_blank" rel="noopener">${EXTERNAL_ICON} Read more</a>`;
      if (moreLinks && moreLinks !== "undefined" && moreLinks !== "")
        html += `<a class="link-btn" href="${moreLinks}" target="_blank" rel="noopener">${EXTERNAL_ICON} More links</a>`;
      return html ? `<div class="card-links">${html}</div>` : "";
    }

    function renderMonthCard(ev) {
      const badge    = parseMonthBadge(ev.date);
      const embedUrl = toEmbedUrl(ev.videoLink);
      const videoHtml = embedUrl
        ? `<iframe src="${embedUrl}" title="${ev.title}" frameborder="0" allowfullscreen></iframe>`
        : `<div class="no-video"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`;

      return `
        <div class="card-month">
          <div class="card-month-video">${videoHtml}</div>
          <div class="card-month-body">
            <span class="month-badge">${badge}</span>
            <div class="card-title">${ev.title}</div>
            ${ev.description ? `<div class="card-description">${ev.description}</div>` : ""}
            ${linksHtml(ev.readMore, ev.moreLinks)}
          </div>
        </div>`;
    }

    fetch(FEED_URL)
      .then(r => r.json())
      .then(data => {
        const events    = (data.events || []).filter(ev => detectDateType(ev.date) === "month");
        const container = document.getElementById("event-container");

        if (!events.length) {
          container.innerHTML = "<p class='status-msg'>No monthly events.</p>";
          return;
        }

        container.innerHTML = events.map(renderMonthCard).join("");
      })
      .catch(() => {
        document.getElementById("event-container").innerHTML =
          "<p class='error-msg'>Unable to load events. Please try again later.</p>";
      });
  </script>
</body>
</html>
